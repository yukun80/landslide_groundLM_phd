# 【中文导读｜第 4 步】这是一份数据来源清单，告诉训练器到哪里读取样本和图片。
# 此示例的 eval 重用了训练文件前 16 条，仅检查流程，不能作为独立泛化评估。
# Stage 2 manifest for the synthetic toy data written by make_toy_data.py.
# Relative paths resolve against this file's directory. The `eval:` section
# enables training-time evaluation with --eval_strategy steps.
# 训练使用的数据分组。
train:
  # 数据来源列表；可以列出多个来源。
  datasets:
    # 便于日志识别的数据名称。
    - name: toy_stage2
      # 每行一条样本的文件路径，相对本清单目录。
      path: toy/stage2.jsonl
      # 样本中相对图片文件名所依赖的根目录。
      image_folder: toy/images
      # 数据用途标签，便于报告按来源统计。
      tag: sft
# 训练过程中检查损失的数据分组。
eval:
  # 数据来源列表；可以列出多个来源。
  datasets:
    # 便于日志识别的数据名称。
    - name: toy_stage2_eval
      # 每行一条样本的文件路径，相对本清单目录。
      path: toy/stage2.jsonl
      # 样本中相对图片文件名所依赖的根目录。
      image_folder: toy/images
      # 数据用途标签，便于报告按来源统计。
      tag: sft
      # 只读取指定范围；first:16 表示前 16 条。
      sampling_strategy: first:16
